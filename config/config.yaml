# ============================================================================
# NullQuant — research configuration
# Single source of truth for the universe, strategy, costs, and validation.
# Everything downstream reads from here so runs are reproducible and auditable.
# ============================================================================

seed: 42                       # global RNG seed (numpy, sklearn, torch)

data:
  # 8 liquid majors with the longest available daily history on Yahoo Finance.
  # NOTE: this list contains only *currently listed* coins, so the backtest has
  # inherent survivorship bias (see research/report.md). Documented, not hidden.
  universe:
    - BTC-USD
    - ETH-USD
    - BNB-USD
    - XRP-USD
    - ADA-USD
    - SOL-USD
    - DOGE-USD
    - LTC-USD
  start: "2019-01-01"          # history start (assets join as they list)
  history_years: 6
  cache_dir: "data"
  min_history_days: 250        # drop an asset-day until it has this much history
  funding:
    enabled: true              # fetch + cache perp funding rates (Binance); the
                               # whole system degrades gracefully if unavailable

strategy:
  sma_short: 50                # fast SMA (base crossover trigger)
  sma_long: 200               # slow SMA
  atr_period: 14
  # Cross-sectional overlay: rank by blended trend + risk-adjusted momentum.
  momentum_lookback: 90        # trading days for cross-sectional momentum
  vol_lookback: 30             # realized-vol estimate window (for sizing)
  top_k: 3                     # go long the top_k ranked, short the bottom_k
  bottom_k: 3
  rebalance: "W"               # rebalance frequency (W = weekly)

risk:
  target_portfolio_vol: 0.20   # annualized vol target for the book
  max_asset_weight: 0.40       # cap on any single-asset gross weight
  max_gross_leverage: 2.0      # sum |w| cap
  vol_floor: 0.01              # daily vol floor to avoid div-by-zero blow-ups

costs:
  taker_fee_bps: 10.0          # 0.10% per side — realistic retail crypto taker
  slippage_bps: 5.0            # base slippage per side on traded notional
  spread_bps: 4.0              # half-spread crossing cost per side
  # Sensitivity sweep multipliers applied to the whole cost stack.
  sweep_multipliers: [0.0, 0.5, 1.0, 2.0, 4.0]

validation:
  walk_forward:
    train_years: 3
    test_months: 6
    anchored: false            # false = rolling window, true = expanding
  purged_cv:
    n_splits: 6
    embargo_frac: 0.01         # embargo as a fraction of total sample length

# ── ML layer (rebuilt) ────────────────────────────────────────────────────────
# Four creative, OOS-validated models. Three produce a trading DIRECTION
# (learning-to-rank, regime-switching, lead-lag); conformal produces a
# confidence-based EXPOSURE multiplier that can size any of them.
ml:
  horizon: 5                   # forward horizon (trading days) for ML targets

  ltr:                         # learning-to-rank cross-sectional selector
    lookbacks: [10, 30, 90]    # momentum feature lookbacks (days)
    train_years: 3             # trailing training window
    refit_every: 21            # walk-forward refit cadence (days)
    top_k: 3                   # long the top-k ranked coins
    bottom_k: 3                # short the bottom-k ranked coins
    n_estimators: 300

  regime:                      # HMM regime-switching meta-controller
    n_states: 3
    train_years: 3
    refit_every: 21

  leadlag:                     # lead-lag contagion network
    max_lag: 5                 # search leads up to this many days
    lookback: 120              # trailing window to estimate the network
    refit_every: 21
    top_edges: 8               # strongest directed edges kept each refit
    funding_weight: 0.5        # weight of the structural funding tilt in the book
                               # (0 = pure price-action lead-lag)

  conformal:                   # conformal confidence-gated sizing overlay
    alpha: 0.10                # 1 − coverage (0.10 ⇒ 90% prediction intervals)
    train_years: 3
    calib_frac: 0.3            # fraction of the train window held out for calibration
    refit_every: 21
    mode: continuous           # continuous = inverse-width sizer; binary = legacy gate
    gamma: 1.0                 # inverse-width exponent (higher = more aggressive sizing)
    floor: 0.05                # minimum exposure when intervals are very wide
